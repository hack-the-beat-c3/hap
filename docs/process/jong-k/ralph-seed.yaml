ontology_schema:
  name: PartyTarotIntegration
  description: 기존 파티 룸 안의 페이지 세션 개인정보 입력, 간이 사주, 준비 상태, 호스트 권위 카드 공개와 결과를 표현한다.
  fields:
    - { name: room, type: object, description: PIN·단계·참가자·공유 덱·공개 결과를 소유하는 파티 상태, required: true }
    - { name: participant, type: object, description: 닉네임·준비·파생 오행·공개 후 카드를 가진 참가자, required: true }
    - { name: entryPoint, type: string, description: 파티 랜딩 `/` 또는 게스트 딥링크 `?pin=`, required: true }
    - { name: consent, type: boolean, description: 현재 페이지 입력 세션의 개인정보 처리 동의, required: true }
    - { name: birthInput, type: object, description: 브라우저에서만 처리 후 제거되는 원본 생년월일, required: true }
    - { name: derivedProfile, type: object, description: 로컬 간이 사주 파생 오행과 문구, required: true }
    - { name: roomPhase, type: string, description: 입장·준비·공개 완료 단계, required: true }
    - { name: revealReadiness, type: boolean, description: 선배정이 아닌 카드 공개 준비 상태, required: true }
    - { name: card, type: object, description: 호스트 공개 시 공유 덱에서 배분되는 한 장, required: true }
    - { name: revealResult, type: object, description: 공개 후 카드·해설·우승·PNG·리캡, required: true }
    - { name: ghostSlot, type: object, description: 공개 전에 호스트가 제거 가능한 기존 참가자 슬롯, required: true }
    - { name: privacyState, type: object, description: 원본 입력 제거와 비저장 상태, required: true }
    - { name: verificationEvidence, type: array, description: 테스트·브라우저·커밋·PR 증거, required: true }
evaluation_principles:
  - { name: 기존 파티 UX 보존, description: main 진입점·룸 기능·타인 변경을 보존하는지 평가한다., weight: 0.3 }
  - { name: 개인정보 및 공개 경계, description: 원본 입력 비저장과 공개 전 카드 차단을 평가한다., weight: 0.3 }
  - { name: 권위 상태와 수명주기, description: 공유 카드·동시 공개·재입장 정책의 일관성을 평가한다., weight: 0.2 }
  - { name: 검증 및 추적 가능성, description: 테스트·문서·PR 증거의 정합성을 평가한다., weight: 0.2 }
exit_conditions:
  - name: 통합 완료
    description: 요구된 참가자 흐름과 개인정보·공개·재입장 계약이 구현·검증되면 종료한다.
    criteria: 모든 acceptance criterion과 테스트·자산·lint·build·브라우저·문서·push 증거가 확인된다.
  - name: 보존 불가 차단
    description: 타인의 변경을 삭제하거나 main 직접 작업·force push 없이 충돌을 해결할 수 없으면 완료를 주장하지 않는다.
    criteria: 기존 main UX 보존과 필수 통합 계약을 동시에 충족할 안전한 변경 경로가 없다.
  - name: 범위 확장 차단
    description: 재연결 토큰·서버 지속성·PR #4 대시보드·추가 룸 기능이 필요하면 별도 ADR과 승인을 기다린다.
    criteria: 승인되지 않은 범위 확장 없이는 acceptance criterion을 만족할 수 없다.
