  - description: ADR와 5대 설계문서가 통합 동작 및 제한사항과 일치하고 작업 브랜치가 clean 상태로 upstream에 모두 푸시되어 있다.
    semantic_ac_key: ac_cfe9ea90c1ddd8e4
    verify_command: test "$(git branch --show-current)" != main && test -z "$(git status --porcelain)" && test "$(git rev-list --count '@{u}..HEAD')" -eq 0
    expected_artifacts:
