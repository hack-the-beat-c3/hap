goal: '김종한(@jong-k)이 통합 DRI로서 최신 main의 파티 UX와 기존 팀 기능을 보존하면서 충돌 중인 PR #5(commit 5fadcf4)의 개인정보 동의·간이 사주·타로 해설·결과 PNG 기능을 파티 참가자의 개인 단계에 통합하고 검증·문서화·푸시한다.'
task_type: code
brownfield_context:
  project_type: brownfield
  context_references:
    - path: /mnt/d/klab/2026-hackathon/2026-gdg-08-28-해커톤/hap
      role: primary
      summary: 최신 main의 파티 랜딩, 게스트 딥링크, 룸 공유 덱과 PR #5 기능을 통합할 기존 애플리케이션
    - path: git:docs/adr-0001-tarot-design@5fadcf4
      role: reference
      summary: 충돌 중인 PR #5의 동의·생년월일 입력·로컬 간이 사주·타로 이미지·해설·PNG 및 설계문서 변경
    - path: git:1470887
      role: reference
      summary: 명시적 연결 계약 없이 이번 통합 완료 범위에 섞지 않을 PR #4 파티 대시보드 산출물
  existing_patterns:
    - 파티 랜딩 `/`과 게스트 딥링크 `?pin=`를 상위 진입 계약으로 사용한다.
    - 룸 공유 덱과 호스트 공개 결과를 카드 권위 상태로 사용한다.
    - BroadcastChannel 기반 페이지 세션 MVP를 유지한다.
    - 개인 입력 상태는 React 로컬 상태에서 처리하고 원본 생년월일은 처리 후 제거한다.
    - 주요 범위·충돌·상태 결정은 ADR에 기록한다.
    - 코드와 5대 설계문서 및 QA 증거를 같은 변경 단위에서 일치시킨다.
    - pnpm test, test:assets, lint, build 스크립트로 검증한다.
    - 작업 브랜치에서 커밋·upstream push하고 PR에 증거를 남긴다.
  existing_dependencies:
    - React
    - BroadcastChannel API
    - Web Crypto API
    - pnpm
    - 최신 main의 룸·공유 덱·호스트 공개 구현
constraints:
  - 기본 진입점은 최신 main의 파티 랜딩 `/`과 게스트 딥링크 `?pin=`로 유지한다.
  - PR #5 기능을 별도 solo 루트로 노출하거나 App 전체를 덮어쓰지 않는다.
  - 개인 흐름은 파티 참가 단계 안에서 동의→생년월일 입력→로컬 간이 사주 확인→카드 공개 준비→호스트 공개 후 결과 확인 순서로 제공한다.
  - 카드 배분과 공개 결과는 main의 룸 공유 덱과 호스트 권위 상태를 사용하며 통합 경로에서 PR #5의 독립 클라이언트 추첨을 호출하지 않는다.
  - BroadcastChannel MVP에서는 공개 전에 비밀 카드를 선배정하지 않고 호스트 공개 시점에 공유 덱을 배분한다.
  - 공개 전에는 카드 ID·이미지·이름·해설·순위·우승자·리캡·PNG를 DOM이나 공유 payload에 포함하지 않는다.
  - 공개 전 문구는 `카드 배정 완료`가 아니라 `카드 공개 준비 완료`로 표시한다.
  - 공개 후에만 모든 화면에 같은 카드와 우승 결과를 표시하고 개인 카드 PNG와 파티 리캡을 활성화한다.
  - 원본 생년월일은 서버·URL·Web Storage·공유 payload로 보내거나 저장하지 않고 추첨 후 React 상태와 DOM에서도 제거한다.
  - 동의·파생 오행·개인 결과도 URL이나 Web Storage에 저장하지 않으며 개인 입력 정보는 페이지 세션으로 제한한다.
  - 새로고침 시 동의와 생년월일을 다시 입력하게 하고 `개인정보 보호를 위해 입력 세션이 초기화되었습니다`라고 안내한다.
  - PIN과 닉네임으로 기존 참가자 슬롯을 자동 복구하지 않는다.
  - 공개 전에는 호스트가 유령 슬롯을 제거할 수 있고 제거 후 동일 닉네임의 재입장을 허용한다.
  - 공개 후에는 신규 입장과 슬롯 인계를 차단하며 준비 상태나 카드 결과의 자동 복구를 주장하지 않는다.
  - 재연결 토큰·서버 지속성은 이번 범위에 추가하지 않으며 향후 불투명 토큰 도입은 별도 ADR로 결정한다.
  - PR #4(commit 1470887)의 파티 대시보드는 독립 산출물로 유지하고 명시된 연결 계약 밖의 기능을 완료 범위에 합산하지 않는다.
  - 충돌은 의미 단위로 해결하고 main의 기존 기능과 타인의 변경을 삭제하지 않는다.
  - 범위 결정과 충돌 해결을 ADR로 기록하고 5대 설계문서 및 QA 증거를 실제 구현과 일치시킨다.
  - 모바일 390x844에서 입력→사주→카드 공개→PNG 다운로드 흐름을 유지한다.
  - '`pnpm test`, `pnpm run test:assets`, `pnpm run lint`, `pnpm run build`를 모두 통과해야 한다.'
  - main에서 직접 작업하거나 force push하지 않으며 모든 변경을 ADR 규칙에 맞춰 작업 브랜치에 커밋·푸시하고 PR에 검증 증거를 남긴다.
  - 검증 없이 완료를 주장하지 않는다.
acceptance_criteria:
  - description: 파티 랜딩과 `?pin=` 진입을 유지한 채 참가자가 동의·생년월일 입력·간이 사주·카드 공개 준비를 거쳐 호스트 공개 후 동일한 카드 해설·우승 결과·개인 PNG·파티 리캡을 확인할 수 있다.
    semantic_ac_key: ac_5a371bc65aaa4c7f
    verify_command: pnpm test
  - description: 공개 전 카드 비밀 정보가 DOM과 공유 payload에 존재하지 않고 공개 시점에 모든 화면에 동일한 한 장과 결과가 나타난다.
    semantic_ac_key: ac_4199d3d14d6a5fe1
    verify_command: pnpm test
  - description: 원본 생년월일이 서버·URL·Web Storage·공유 payload에 남지 않고 추첨 후 React 상태와 DOM에서도 제거된다.
    semantic_ac_key: ac_bb34cb2cb2c6e156
    verify_command: pnpm test
  - description: 새로고침한 게스트는 개인정보 초기화 안내와 함께 새 입력 세션으로 재입장하며 공개 전 유령 슬롯 제거와 공개 후 신규 입장 차단 정책이 일관되게 적용된다.
    semantic_ac_key: ac_a548465fcaefa7a9
    verify_command: pnpm test
  - description: 테스트와 자산 검사 22/22가 통과하고 lint와 production build가 성공한다.
    semantic_ac_key: ac_c18d1b5672d5aeb7
    verify_command: pnpm test && pnpm run test:assets && pnpm run lint && pnpm run build
  - description: 모바일 390x844에서 입력→사주→카드 공개→PNG 다운로드 흐름과 공개 전후 정보 노출 경계가 브라우저 증거로 확인된다.
